version: '3.8'

services:
  db:
    image: mongo:latest
    container_name: attendance_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  web:
    build: .
    container_name: attendance_streamlit
    ports:
      - "8501:8501"
    environment:
      - MONGODB_URI=mongodb://db:27017/
      - DATABASE_NAME=facerecognition
    volumes:
      - .:/app
    depends_on:
      - db
    restart: always

volumes:
  mongo_data:
